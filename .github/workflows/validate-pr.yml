name: Validate PR to deploy

on:
  pull_request:
    branches: [main]

env:
  BRANCH: ${{ github.ref }}

jobs:
  validate_pr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    steps:
      - name: Clone repo
        uses: actions/checkout@v2

      - name: Install dependencies
        run: npm i

      - name: Build repo
        run:  tsc

      - name: Bump Version
        run:  npm version patch

      - name: Run test
        run: npm run test
